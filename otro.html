<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="iconAndFonts/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body>
    <div id="carouselCards" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">

    <!-- Slide 1 -->
    <div class="carousel-item active">
      <div class="d-flex justify-content-center gap-3">
        <div class="card" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=1" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 1</h5>
            <p class="card-text">Contenido de la primera tarjeta.</p>
          </div>
        </div>
        <div class="card d-none d-md-block" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=2" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 2</h5>
            <p class="card-text">Contenido de la segunda tarjeta.</p>
          </div>
        </div>
        <div class="card d-none d-lg-block" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=3" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 3</h5>
            <p class="card-text">Contenido de la tercera tarjeta.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="carousel-item">
      <div class="d-flex justify-content-center gap-3">
        <div class="card" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=4" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 4</h5>
            <p class="card-text">Contenido de la cuarta tarjeta.</p>
          </div>
        </div>
        <div class="card d-none d-md-block" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=5" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 5</h5>
            <p class="card-text">Contenido de la quinta tarjeta.</p>
          </div>
        </div>
        <div class="card d-none d-lg-block" style="min-width: 18rem;">
          <img src="https://picsum.photos/300/200?random=6" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Card 6</h5>
            <p class="card-text">Contenido de la sexta tarjeta.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Controles -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselCards" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselCards" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

     <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
